version: '3.8'

services:
  supervision-postgres:
    image: postgres:16-alpine
    container_name: supervision-postgres
    restart: always
    environment:
      POSTGRES_DB: supervision_db
      POSTGRES_USER: supervision_user
      POSTGRES_PASSWORD: supervision_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  supervision-backend:
    build: .
    container_name: supervision-backend
    restart: on-failure
    depends_on:
      - supervision-postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://supervision-postgres:5432/supervision_db
      SPRING_DATASOURCE_USERNAME: supervision_user
      SPRING_DATASOURCE_PASSWORD: supervision_pass
    ports:
      - "8080:8080"

volumes:
  pgdata:

